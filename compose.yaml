services:
  refract:
    build:
      context: .
      args:
        NPM_REGISTRY: ${NPM_REGISTRY:-https://mirrors.cloud.tencent.com/npm}
        ALPINE_MIRROR: ${ALPINE_MIRROR:-https://mirrors.cloud.tencent.com/alpine}
    image: refract:local
    init: true
    restart: unless-stopped
    ports:
      - "127.0.0.1:3939:3939/tcp"
      - "127.0.0.1:3939:3939/udp"
    environment:
      REFRACT_LISTEN: 0.0.0.0:3939
      REFRACT_DATABASE: /data/refract.db
      REFRACT_REQUIRE_AUTH: "true"
      REFRACT_LOG: ${REFRACT_LOG:-info}
      # 32 字节静态加密主密钥（base64）。配置后渠道密钥在库内 AES-256-GCM 加密存储；
      # 不配置则兼容旧行为（明文）。轮换需重加密全部渠道密钥，谨慎变更。
      REFRACT_MASTER_KEY: ${REFRACT_MASTER_KEY:-}
    volumes:
      - refract-data:/data
    read_only: true
    tmpfs:
      - /tmp:size=64m,mode=1777
    security_opt:
      - no-new-privileges:true

volumes:
  refract-data:

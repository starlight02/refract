[package]
name = "refract-api"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
refract-core = { workspace = true }
refract-protocol = { workspace = true }
refract-router = { workspace = true }
refract-store = { workspace = true }
refract-upstream = { workspace = true }
arc-swap = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
chrono = { workspace = true }
futures-util = { workspace = true }
http = { workspace = true }
mime_guess = { workspace = true }
rand = { workspace = true }
rust-embed = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
thiserror = { workspace = true }
tokio = { workspace = true }
tokio-stream = { workspace = true }
tracing = { workspace = true }
uuid = { workspace = true }
warp = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }
pretty_assertions = { workspace = true }
wiremock = { workspace = true }
futures = { workspace = true }
sqlx = { workspace = true }
# warp 0.4 的 `default = []`，`warp::test` 藏在 `test` feature 后面。
# 不加这行，所有过滤器测试都会报「找不到 warp::test」。
warp = { workspace = true, features = ["test"] }

[lints]
workspace = true

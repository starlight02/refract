name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked

  web:
    name: Web quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - working-directory: web
        run: pnpm run check
      - working-directory: web
        run: pnpm run test:unit
      - working-directory: web
        run: pnpm run build

  e2e:
    name: Full-stack browser tests
    runs-on: ubuntu-latest
    needs: [rust, web]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v4
        with:
          version: 11.21.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - working-directory: web
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: web
        run: pnpm run test:e2e

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: [rust, web]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: refract:ci
          build-args: |
            NPM_REGISTRY=https://registry.npmjs.org
            ALPINE_MIRROR=https://dl-cdn.alpinelinux.org/alpine
          cache-from: type=gha,scope=refract-ci
          cache-to: type=gha,mode=max,scope=refract-ci
      - name: Smoke test image
        run: |
          set -eu
          # shellcheck disable=SC2329
          cleanup() {
            docker rm -f refract-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name refract-ci \
            --env REFRACT_ADMIN_TOKEN=ci-test-token \
            --publish 127.0.0.1:3939:3939 \
            refract:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
                http://127.0.0.1:3939/health/ready >/dev/null; then
              curl --fail --silent --show-error \
                http://127.0.0.1:3939/ >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "container did not become ready" >&2
          exit 1

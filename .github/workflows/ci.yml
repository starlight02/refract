name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  rust:
    name: Rust quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets --all-features -- -D warnings
      - run: cargo test --workspace --all-targets --all-features --locked

  frontend:
    name: Frontend quality gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Check contracts
        run: pnpm --filter @refract/contracts check
      - name: Check admin
        run: pnpm --filter @refract/admin check
      - name: Test admin
        run: pnpm --filter @refract/admin test:unit
      - name: Build admin
        run: pnpm --filter @refract/admin build
      - name: Check homepage
        run: pnpm --filter @refract/homepage check
      - name: Build homepage
        run: pnpm --filter @refract/homepage build
      # 后台产物给 container / e2e job 复用，避免各自重新构建。
      - uses: actions/upload-artifact@v7
        with:
          name: admin-dist
          path: apps/admin/dist
          retention-days: 1
      # Homepage 不进入 Rust 二进制，保留独立静态产物供部署流水线使用。
      - uses: actions/upload-artifact@v7
        with:
          name: homepage-dist
          path: apps/homepage/dist
          retention-days: 1

  e2e:
    name: Full-stack browser tests
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
      - uses: Swatinem/rust-cache@v2
      - uses: pnpm/action-setup@v6
        with:
          version: 11.22.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      # 复用 frontend job 构建的后台产物（serve.sh 检测到 dist 存在就跳过构建）。
      - uses: actions/download-artifact@v8
        with:
          name: admin-dist
          path: apps/admin/dist
      - working-directory: apps/admin
        run: pnpm exec playwright install --with-deps chromium
      - working-directory: apps/admin
        run: pnpm run test:e2e

  container:
    name: Container build
    runs-on: ubuntu-latest
    needs: [rust, frontend]
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      # Rust 在宿主机用 musl 静态链接编译（ci profile：thin LTO + 16 代码单元），
      # rust-cache 保证稳态 1-2 分钟；镜像只做 alpine 底座 + COPY，几秒完成。
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@v2
        with:
          key: ci-musl-x86_64
      - run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends musl-tools
      - uses: actions/download-artifact@v8
        with:
          name: admin-dist
          path: apps/admin/dist
      - run: cargo build --locked --profile ci -p refract-server --target x86_64-unknown-linux-musl
      # build-contexts 供 Dockerfile 的 ARG 选择源使用：
      #   admin-dist/ → /admin/dist（admin_src=admin-dist 时跳过镜像内后台构建）
      #   bin/<arch>/refract-server（bin_src=bin 时按 $TARGETARCH 选取，跳过镜像内编译）
      - run: |
          mkdir -p bin/amd64 admin-dist/admin
          cp target/x86_64-unknown-linux-musl/ci/refract-server bin/amd64/refract-server
          cp -r apps/admin/dist admin-dist/admin/dist
      - uses: docker/setup-buildx-action@v4
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64
          push: false
          load: true
          provenance: false
          tags: refract:ci
          build-args: |
            admin_src=admin-dist
            bin_src=bin
            NPM_REGISTRY=https://registry.npmjs.org
            ALPINE_MIRROR=https://dl-cdn.alpinelinux.org/alpine
          build-contexts: |
            bin=./bin
            admin-dist=./admin-dist
          cache-from: type=gha,scope=refract-ci
          cache-to: type=gha,mode=max,scope=refract-ci
      - name: Smoke test image
        run: |
          set -eu
          # shellcheck disable=SC2329
          cleanup() {
            docker rm -f refract-ci >/dev/null 2>&1 || true
          }
          trap cleanup EXIT
          docker run --detach --name refract-ci \
            --env REFRACT_ADMIN_TOKEN=ci-test-token \
            --publish 127.0.0.1:3939:3939 \
            refract:ci
          for _ in $(seq 1 30); do
            if curl --fail --silent --show-error \
                http://127.0.0.1:3939/health/ready >/dev/null; then
              curl --fail --silent --show-error \
                http://127.0.0.1:3939/ >/dev/null
              exit 0
            fi
            sleep 1
          done
          echo "container did not become ready" >&2
          exit 1

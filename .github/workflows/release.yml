# 发布流水线：推 v* 标签触发。
#
# 产物两类：
# 1. 多平台单二进制（前端已嵌入）—— 下载即用，个人部署的主路径；
# 2. ghcr 容器镜像（amd64 + arm64）—— compose/k8s 用户的路径。
#
# 前端只构建一次并在各平台间共享：五个平台各跑一遍 pnpm build 纯属浪费，
# 且会让「同一版本不同平台的前端产物不一致」成为可能。
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  web:
    name: Build embedded frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 11.21.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.12.0
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml
      - working-directory: web
        run: pnpm install --frozen-lockfile
      - working-directory: web
        run: pnpm run build
      - uses: actions/upload-artifact@v7
        with:
          name: web-dist
          path: web/dist
          retention-days: 1

  binaries:
    name: ${{ matrix.target }}
    needs: [web]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        include:
          # musl 静态链接：产物不依赖宿主 glibc 版本，老发行版也能跑。
          - target: x86_64-unknown-linux-musl
            os: ubuntu-latest
          - target: aarch64-unknown-linux-musl
            os: ubuntu-24.04-arm
          - target: x86_64-apple-darwin
            os: macos-15-intel
          - target: aarch64-apple-darwin
            os: macos-latest
          - target: x86_64-pc-windows-msvc
            os: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.94.0
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}
      - name: Install musl toolchain
        if: contains(matrix.target, 'musl')
        run: |
          sudo apt-get update -o Acquire::Retries=3 -o Acquire::http::Timeout=15
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y --no-install-recommends musl-tools
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web/dist
      - name: Build
        run: cargo build --release --locked -p refract-server --target ${{ matrix.target }}
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          cd target/${{ matrix.target }}/release
          tar czf refract-${{ github.ref_name }}-${{ matrix.target }}.tar.gz refract-server
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cd target/${{ matrix.target }}/release
          Compress-Archive -Path refract-server.exe -DestinationPath "refract-${{ github.ref_name }}-${{ matrix.target }}.zip"
      - uses: actions/upload-artifact@v7
        with:
          name: binary-${{ matrix.target }}
          path: |
            target/${{ matrix.target }}/release/refract-*.tar.gz
            target/${{ matrix.target }}/release/refract-*.zip
          retention-days: 1

  release:
    name: Publish GitHub Release
    needs: [binaries]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: binary-*
          merge-multiple: true
          path: dist
      - uses: softprops/action-gh-release@v3
        with:
          files: dist/*
          generate_release_notes: true

  # 双平台镜像 = 两台原生 runner 各自组装 + 合并多架构清单，
  # 全程无 QEMU：binaries 已在原生架构下编好 musl 二进制（前端已内嵌），
  # 镜像只做 alpine 底座 + COPY。单 job 双平台方案会让 arm64 stage
  # 在 amd64 runner 上走 QEMU 模拟，既慢又会 OOM。
  image:
    name: Container image (${{ matrix.arch }})
    needs: [binaries]
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            target: x86_64-unknown-linux-musl
          - arch: arm64
            runner: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: binary-${{ matrix.target }}
          path: dist
      - uses: actions/download-artifact@v8
        with:
          name: web-dist
          path: web-dist/web/dist
      - run: |
          mkdir -p bin/${{ matrix.arch }}
          tar xzf dist/refract-*.tar.gz -C bin/${{ matrix.arch }}
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}},suffix=-${{ matrix.arch }}
            type=semver,pattern={{major}}.{{minor}},suffix=-${{ matrix.arch }}
            type=raw,value=latest-${{ matrix.arch }},enable=${{ !contains(github.ref_name, '-') }}
            type=sha,suffix=-${{ matrix.arch }}
      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/${{ matrix.arch }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            web_src=web-dist
            bin_src=bin
            NPM_REGISTRY=https://registry.npmjs.org
            ALPINE_MIRROR=https://dl-cdn.alpinelinux.org/alpine
          build-contexts: |
            bin=./bin
            web-dist=./web-dist
          cache-from: type=gha,scope=refract-release-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=refract-release-${{ matrix.arch }}

  # 把两份单架构镜像合并成多架构清单（纯 manifest 操作，不需要本机执行）。
  image-manifest:
    name: Merge multi-arch manifest
    needs: [image]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@v6
        id: meta
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest,enable=${{ !contains(github.ref_name, '-') }}
            type=sha
      - name: Create manifest lists
        env:
          TAGS: ${{ steps.meta.outputs.tags }}
        run: |
          for tag in $TAGS; do
            docker buildx imagetools create -t "$tag" "${tag}-amd64" "${tag}-arm64"
          done

packages:
  - apps/*
  - packages/*

allowBuilds:
  lefthook: true
  # Effect v4 经 msgpackr 传递引入。它只是 Node 侧的原生加速件，
  # 浏览器构建 tree-shake 后根本不引用 —— 不为它编译原生模块。
  msgpackr-extract: false
  pnpm: true
  vue-demi: true

updateNotifier: false

catalog:
  vite: npm:@voidzero-dev/vite-plus-core@~0.2.9
  vite-plus: ~0.2.9

overrides:
  '@vue/compat': ~3.6.0-rc.3
  '@vue/compiler-core': ~3.6.0-rc.3
  '@vue/compiler-dom': ~3.6.0-rc.3
  '@vue/compiler-sfc': ~3.6.0-rc.3
  '@vue/compiler-ssr': ~3.6.0-rc.3
  '@vue/reactivity': ~3.6.0-rc.3
  '@vue/runtime-core': ~3.6.0-rc.3
  '@vue/runtime-dom': ~3.6.0-rc.3
  '@vue/runtime-vapor': ~3.6.0-rc.3
  '@vue/server-renderer': ~3.6.0-rc.3
  '@vue/shared': ~3.6.0-rc.3
  vite: 'catalog:'
  vitest: 4.1.10
  vue: ~3.6.0-rc.3

peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'

minimumReleaseAgeExclude:
  - '@vue/compiler-core@3.6.0-rc.3'
  - '@vue/compiler-dom@3.6.0-rc.3'
  - '@vue/compiler-sfc@3.6.0-rc.3'
  - '@vue/compiler-ssr@3.6.0-rc.3'
  - '@vue/compiler-vapor@3.6.0-rc.3'
  - '@vue/reactivity@3.6.0-rc.3'
  - '@vue/runtime-core@3.6.0-rc.3'
  - '@vue/runtime-dom@3.6.0-rc.3'
  - '@vue/runtime-vapor@3.6.0-rc.3'
  - '@vue/server-renderer@3.6.0-rc.3'
  - '@vue/shared@3.6.0-rc.3'
  - vue@3.6.0-rc.3
  - effect@4.0.0-rc.112
  - '@pnpm/exe.darwin-arm64@12.0.0'
  - '@pnpm/exe.darwin-x64@12.0.0'
  - '@pnpm/exe.linux-arm64-musl@12.0.0'
  - '@pnpm/exe.linux-arm64@12.0.0'
  - '@pnpm/exe.linux-x64-musl@12.0.0'
  - '@pnpm/exe.linux-x64@12.0.0'
  - '@pnpm/exe.win32-arm64@12.0.0'
  - '@pnpm/exe.win32-x64@12.0.0'
  - pnpm@12.0.0
